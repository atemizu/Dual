<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>Page Translate</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header>
  <img src="icons/48.png" alt="" width="24" height="24">
  <h1 id="title"></h1>
</header>

<p id="checking" class="hint"></p>
<p id="host-error" class="status error" hidden></p>

<div id="setup" hidden>
  <p id="intro" class="status"></p>
  <p id="need" class="status"></p>
  <p id="partial" class="hint" hidden></p>
  <p id="free" class="hint"></p>
  <div id="progress" hidden>
    <div class="bar"><div id="bar-fill"></div></div>
    <div class="row">
      <span id="progress-text" class="hint"></span>
      <button id="cancel" class="quiet"></button>
    </div>
  </div>
  <p id="download-error" class="hint error" hidden></p>
  <button id="download" class="primary wide"></button>
</div>

<div id="ready" hidden>
  <p id="no-page" class="hint" hidden></p>
  <div id="page" hidden>
    <p id="page-is" class="status"></p>
    <div id="choices" class="choices">
      <button id="to-ja"></button>
      <button id="to-en"></button>
    </div>
    <div id="running" hidden>
      <p id="running-text" class="status"></p>
      <div class="row end">
        <button id="stop" class="quiet"></button>
        <button id="resume" class="quiet" hidden></button>
        <button id="restore" class="quiet"></button>
      </div>
    </div>
  </div>
  <section>
    <p id="model" class="hint"></p>
    <p id="slow" class="hint" hidden></p>
    <p id="shortcut" class="hint"></p>
  </section>
</div>

<script type="module" src="popup.js"></script>
</body>
</html>
